<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITY VIP - 后端服务测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .status {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .test-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: transform 0.2s;
        }
        
        .test-button:hover {
            transform: translateY(-2px);
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AITY VIP 后端服务测试</h1>
        
        <div id="status" class="status info">
            正在检查后端服务状态...
        </div>
        
        <div style="text-align: center; margin: 20px 0;">
            <button class="test-button" onclick="testHealth()">测试健康检查</button>
            <button class="test-button" onclick="testRoot()">测试根路由</button>
            <button class="test-button" onclick="testAuth()">测试认证接口</button>
        </div>
        
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001';
        
        async function testHealth() {
            showResult('正在测试健康检查接口...', true);
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                showResult(`健康检查成功！\n状态码: ${response.status}\n响应数据:\n${JSON.stringify(data, null, 2)}`, false);
                updateStatus('健康检查通过', 'success');
            } catch (error) {
                showResult(`健康检查失败！\n错误信息:\n${error.message}`, false);
                updateStatus('健康检查失败', 'error');
            }
        }
        
        async function testRoot() {
            showResult('正在测试根路由...', true);
            try {
                const response = await fetch(`${API_BASE}/`);
                const data = await response.json();
                showResult(`根路由测试成功！\n状态码: ${response.status}\n响应数据:\n${JSON.stringify(data, null, 2)}`, false);
                updateStatus('根路由测试通过', 'success');
            } catch (error) {
                showResult(`根路由测试失败！\n错误信息:\n${error.message}`, false);
                updateStatus('根路由测试失败', 'error');
            }
        }
        
        async function testAuth() {
            showResult('正在测试认证接口...', true);
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'admin@example.com',
                        password: 'admin123'
                    })
                });
                const data = await response.json();
                showResult(`认证接口测试完成！\n状态码: ${response.status}\n响应数据:\n${JSON.stringify(data, null, 2)}`, false);
                if (response.ok) {
                    updateStatus('认证接口测试通过', 'success');
                } else {
                    updateStatus('认证接口测试失败', 'error');
                }
            } catch (error) {
                showResult(`认证接口测试失败！\n错误信息:\n${error.message}`, false);
                updateStatus('认证接口测试失败', 'error');
            }
        }
        
        function showResult(message, isLoading) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = message;
            
            if (isLoading) {
                resultDiv.innerHTML = '<div class="loading">' + message + '</div>';
            }
        }
        
        function updateStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
        
        // 页面加载时自动测试健康检查
        window.onload = function() {
            setTimeout(testHealth, 1000);
        };
    </script>
</body>
</html>
